name: Safe site tests (no deployment)
on:
  push:
    branches:
      - feature/private-site-analytics-20261123
  pull_request:
    paths:
      - 'landing/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Live Railway analytics smoke check
        run: |
          set -euo pipefail
          URL='https://pavel-chatbots-orders-production.up.railway.app'
          curl -fsS --retry 5 --retry-delay 2 "$URL/healthz" | grep -q '"status": "ok"'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://not-our-site.example' -H 'Content-Type: text/plain' --data '{"event":"page_view","page":"/","source":"other"}' "$URL/event")
          test "$code" = '403'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://pavelbots.tuqo.app' -H 'Content-Type: text/plain' --data '{"event":"page_view","page":"/","source":"other"}' "$URL/event")
          test "$code" = '204'
