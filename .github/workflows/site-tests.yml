name: Safe site tests (no deployment)
on:
  push:
    branches:
      - feature/private-site-analytics-20261123
  pull_request:
    paths:
      - 'landing/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify privacy release does not depend on retired Railway analytics
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const policy = fs.readFileSync('dist/privacy/index.html','utf8');
          const home = fs.readFileSync('dist/index.html','utf8');
          if (!policy.includes('Куценко Павел Евгеньевич') || !policy.includes('Kutsenco-Pavel@yandex.ru')) process.exit(1);
          if (policy.includes('[АДРЕС ДЛЯ ОБРАЩЕНИЙ]') || policy.includes('Черновая информационная страница')) process.exit(1);
          if (home.includes('pavel-chatbots-orders-production.up.railway.app/event')) process.exit(1);
          "
