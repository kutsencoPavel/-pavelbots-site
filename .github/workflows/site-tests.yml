name: Safe site tests (no deployment)
on:
  push:
    branches:
      - feature/private-site-analytics-20261123
  pull_request:
    paths:
      - 'landing/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
